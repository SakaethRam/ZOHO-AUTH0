name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  node-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth0-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: auth0-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

  fastapi-test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth0-main
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi "uvicorn[standard]" ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Import sanity check
        run: python -c "import auth0_server"

  zoho-manifest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest JSON is well-formed
        run: python3 -c "import json; json.load(open('.zoho/plugin-manifest.json'))"

      - name: Validate config JSON is well-formed
        run: python3 -c "import json; json.load(open('.zoho/config.json'))"

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [node-backend, fastapi-test-server]
    steps:
      - uses: actions/checkout@v4

      - name: Build Node.js backend image (no push)
        run: docker build -t zoho-auth0-backend:ci ./auth0-backend

      - name: Build FastAPI test server image (no push)
        run: docker build -t zoho-auth0-test-server:ci ./auth0-main
